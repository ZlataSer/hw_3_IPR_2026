services:
  app:
    build:
      context: .
      dockerfile: Dockerfile

    ports:
      - "${HOST_PORT:-8080}:${PORT:-8000}"

    environment:
      PORT: "${PORT:-8000}"
      GREETING: "${GREETING:-Hello, Docker!}"
      STORAGE: "sqlite"
      DATA_FILE: "/data/counter.db"

    volumes:
      - counter-data:/data

    restart: unless-stopped

volumes:
  counter-data: